<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pegasus HQ</title>
<meta name="description" content="Pegasus.io immersive headquarters: walk through the atrium, the employee floor, and each AI agent's office.">
<style>
:root{color-scheme:dark;--gold:#dfba80;--gold-hi:#ffd998;--cyan:#7ddcf3;--ink:#04070d;--glass:#07101cd0;--line:#9c7c5488;--txt:#f5ebda;--mute:#a6bbca}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:var(--ink);color:var(--txt);font-family:Inter,system-ui,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.serif{font-family:"Cormorant Garamond","Playfair Display",Georgia,serif}

/* ---------- world + scenes ---------- */
#world{position:fixed;inset:0;overflow:hidden;background:#020409}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transform-origin:var(--ox,50%) var(--oy,50%);will-change:transform,opacity,filter}
.scene.active{opacity:1;visibility:visible}
.scene.exit-fwd{animation:exitFwd .95s cubic-bezier(.55,0,.35,1) forwards}
.scene.enter-fwd{animation:enterFwd 1s cubic-bezier(.2,.75,.2,1) both}
.scene.exit-back{animation:exitBack .8s cubic-bezier(.5,0,.4,1) forwards}
.scene.enter-back{animation:enterBack .9s cubic-bezier(.2,.75,.2,1) both}
@keyframes exitFwd{0%{transform:scale(1);opacity:1;filter:none}100%{transform:scale(2.6);opacity:0;filter:blur(10px) brightness(1.5)}}
@keyframes enterFwd{0%{transform:scale(1.35);opacity:0;filter:blur(12px) brightness(1.4)}100%{transform:none;opacity:1;filter:none}}
@keyframes exitBack{to{transform:scale(.72);opacity:0;filter:blur(6px)}}
@keyframes enterBack{0%{transform:scale(1.7);opacity:0;filter:blur(10px)}100%{transform:none;opacity:1;filter:none}}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;pointer-events:none}

/* warp streaks during forward travel */
#warp{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg at var(--ox,50%) var(--oy,50%),#ffffff00 0deg 3deg,#cfe9ff1c 3.4deg 3.8deg,#ffffff00 4.2deg 9deg),radial-gradient(circle at var(--ox,50%) var(--oy,50%),#fff4dc55,transparent 40%);mix-blend-mode:screen}
#warp.on{animation:warp .95s ease-out}
@keyframes warp{0%{opacity:0;transform:scale(.6)}35%{opacity:1}100%{opacity:0;transform:scale(1.8)}}

/* ---------- chrome ---------- */
#chrome{position:fixed;z-index:15;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:14px max(16px,2.5vw);background:linear-gradient(#02050bdd,transparent);pointer-events:none}
#chrome>*{pointer-events:auto}
.brand{font-size:15px;letter-spacing:.32em;color:var(--gold);font-weight:600;white-space:nowrap}
#back{display:none;align-items:center;gap:8px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);border-radius:999px;padding:8px 14px;font-size:12px;letter-spacing:.12em}
#back.show{display:inline-flex}
#crumbs{display:flex;gap:8px;align-items:center;font-size:11px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase;overflow:hidden;white-space:nowrap}
#crumbs b{color:var(--gold-hi);font-weight:600}
.spacer{flex:1}
.pill{border:1px solid #668ca088;border-radius:999px;background:#07121fcc;color:#b9c7d3;font-size:10px;letter-spacing:.14em;padding:6px 10px;white-space:nowrap}
#motion{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:7px 12px;font-size:11px;color:var(--gold)}

/* minimap */
#map{position:fixed;z-index:15;left:max(16px,2.5vw);bottom:16px;display:flex;gap:6px;padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--glass);backdrop-filter:blur(10px)}
#map button{border:0;background:transparent;border-radius:9px;padding:8px 10px;font-size:10px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
#map button.on{background:#1d2a3a;color:var(--gold-hi);box-shadow:inset 0 0 0 1px #dfba8066}

#toast{position:fixed;z-index:30;left:50%;bottom:76px;transform:translate(-50%,20px);opacity:0;transition:.3s;padding:11px 16px;border:1px solid var(--line);border-radius:12px;background:#07101cf0;font-size:12px;color:#d9e6ee;max-width:min(520px,90vw);text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:40;background:#02050b;display:grid;place-items:center;text-align:center;transition:opacity .7s,visibility .7s}
#intro.done{opacity:0;visibility:hidden;pointer-events:none}
#intro video{width:min(520px,80vw);aspect-ratio:16/9;object-fit:cover;mask-image:radial-gradient(ellipse,#000 30%,transparent 74%)}
#intro h2{margin:6px 0 4px;letter-spacing:.4em;color:var(--gold);font-weight:500}
#intro p{margin:0;color:var(--mute);font-size:11px;letter-spacing:.3em}
#enter{margin-top:22px;border:1px solid var(--gold);background:#131f2e;color:var(--gold-hi);border-radius:999px;padding:11px 26px;letter-spacing:.2em;font-size:12px}

/* ---------- hotspots (street-view style markers) ---------- */
.hot{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;padding:0;z-index:2}
.hot .ring{position:relative;width:46px;height:46px;border-radius:50%;border:2px solid var(--c,var(--gold-hi));background:radial-gradient(circle,#ffffff30,#0000 62%);box-shadow:0 0 22px var(--c,var(--gold))}
.hot .ring::before,.hot .ring::after{content:'';position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--c,var(--gold-hi));animation:ping 2.4s ease-out infinite}
.hot .ring::after{animation-delay:1.2s}
.hot .ring i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:18px;color:#fff}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.3);opacity:0}}
.hot .tag{padding:8px 12px;border:1px solid #dfba8099;border-radius:10px;background:#050b14d9;backdrop-filter:blur(8px);text-align:center;white-space:nowrap;transition:transform .2s,border-color .2s}
.hot .tag strong{display:block;font-size:12px;letter-spacing:.16em;color:var(--gold-hi)}
.hot .tag span{display:block;margin-top:3px;font-size:10px;color:var(--mute);letter-spacing:.08em}
.hot:hover .tag,.hot:focus-visible .tag{transform:translateY(-3px);border-color:var(--gold-hi)}
.hot.forward .ring{width:62px;height:62px}
.hot.forward .ring i{font-size:26px}

/* ---------- atrium ---------- */
#s-atrium .bg{filter:saturate(1.08)}
#holo,#holo2{position:absolute;left:50%;top:41%;transform:translate(-50%,-50%);width:min(46vw,620px);mix-blend-mode:screen;mask-image:radial-gradient(ellipse,#000 25%,transparent 72%);opacity:.92;transition:opacity .9s;pointer-events:none}
#holo2{opacity:0}
.atrium-title{position:absolute;left:50%;top:66%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.atrium-title h1{margin:0;font-size:clamp(28px,5.4vw,72px);letter-spacing:.32em;font-weight:500;color:var(--gold-hi);text-shadow:0 0 30px #dfba8077,0 4px 18px #000}
.atrium-title p{margin:6px 0 0;font-size:11px;letter-spacing:.42em;color:#d6c3a2}
.stats{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);display:flex;gap:2px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--glass);backdrop-filter:blur(10px)}
.stats div{padding:10px 18px;text-align:center}.stats b{display:block;font-size:20px;color:var(--gold-hi);font-weight:500}.stats span{font-size:9px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}

/* ---------- employee floor ---------- */
#s-floor .doors{position:absolute;inset:0;z-index:2;transform:translateZ(0);opacity:0;transition:opacity .8s}
#s-floor .bg{z-index:0}#s-floor .shade{z-index:1}
#s-floor.arrived .doors{opacity:1}
.wall{position:absolute;top:30%;bottom:15%;width:27%}
.wall.left{left:1.5%}.wall.right{right:1.5%}
.wall-inner{height:100%;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px}
.wall.left .wall-inner{transform:perspective(900px) rotateY(24deg);transform-origin:left center}
.wall.right .wall-inner{transform:perspective(900px) rotateY(-24deg);transform-origin:right center}
.door{position:relative;display:flex;align-items:center;gap:10px;min-height:0;padding:8px 10px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:12px;background:linear-gradient(135deg,#0a1220e6,#05090fe6);text-align:left;box-shadow:0 0 18px color-mix(in srgb,var(--c) 22%,transparent),inset 0 0 18px #0008;transition:transform .2s,box-shadow .2s,border-color .2s}
.door:hover,.door:focus-visible{transform:scale(1.05);border-color:var(--c);box-shadow:0 0 34px color-mix(in srgb,var(--c) 55%,transparent)}
.orb{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--c);background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff),color-mix(in srgb,var(--c) 40%,#000) 45%,#05090f 75%);font-size:12px;font-weight:700;letter-spacing:.04em;color:#fff;box-shadow:0 0 14px color-mix(in srgb,var(--c) 60%,transparent)}
.door strong{display:block;font-size:13px;letter-spacing:.1em}
.door span{display:block;font-size:10px;color:var(--mute);letter-spacing:.04em;margin-top:2px;line-height:1.25}
.door .live{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:#3ee68a;box-shadow:0 0 8px #3ee68a}
.door .live.next{background:#6b7785;box-shadow:none}
.door.exec{grid-column:1/-1}
.endhall{position:absolute;left:50%;top:40%;transform:translateX(-50%);width:min(34%,420px);text-align:center}
.endhall h2,.endhall p{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.endhall h2{margin:0 0 4px;font-size:12px;letter-spacing:.3em;color:var(--gold-hi);font-weight:500}
.endhall p{margin:0 0 10px;font-size:10px;letter-spacing:.12em;color:var(--mute)}
.endhall .mini{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.endhall .mini button{border:1px solid #7ddcf355;background:#06101ccc;border-radius:999px;padding:5px 10px;font-size:10px;letter-spacing:.12em;color:#cfe7f1}
.endhall .mini button:hover{border-color:var(--cyan)}
.floor-hint{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);font-size:10px;letter-spacing:.3em;color:#d6c3a2;text-shadow:0 2px 8px #000}

/* still hallway that feels alive: the camera never moves, only the light does */
.stage{position:absolute;left:var(--sx,0);top:var(--sy,0);width:var(--sw,100vw);height:var(--sh,100vh);overflow:hidden;transform:translateZ(0);backface-visibility:hidden;contain:strict}
.stage>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fx{position:absolute;pointer-events:none;mix-blend-mode:screen}
.fx-sign{left:30%;top:0;width:36%;height:30%;background:radial-gradient(ellipse at 50% 40%,#ffd99855,transparent 62%);animation:pulse 5s ease-in-out infinite}
.fx-window{left:38%;top:34%;width:24%;height:24%;background:radial-gradient(ellipse,#ff9a6a30,transparent 65%);animation:pulse 7s ease-in-out infinite}
.fx-holo{left:40%;top:52%;width:20%;height:30%;background:radial-gradient(ellipse at 50% 55%,#6fd3ff88,#2a7bff33 40%,transparent 68%);animation:holo 3.2s ease-in-out infinite}
.fx-ring{left:30%;top:72%;width:40%;height:20%;background:radial-gradient(ellipse at 50% 45%,#ffcf7a99,#ffb24633 45%,transparent 70%);animation:pulse 4s ease-in-out infinite}
.fx-floor{inset:0;clip-path:polygon(36% 59%,64% 59%,100% 96%,100% 100%,0 100%,0 96%)}
.fx-floor i{position:absolute;left:0;right:0;top:56%;height:7%;background:linear-gradient(transparent,#ffd38a88 40%,#fff2d0bb 50%,#ffd38a88 60%,transparent);opacity:0;animation:sweep 6s cubic-bezier(.45,0,.75,1) infinite}
.fx-floor i:nth-child(2){animation-delay:-3s}
.fx-strips{inset:0;width:100%;height:100%;filter:drop-shadow(0 0 4px #ffcf7a) drop-shadow(0 0 10px #ffb246)}
.fx-strips line{stroke:#fff6dd;stroke-width:4;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-dasharray:12 88;stroke-dashoffset:0;animation:run 4.4s linear infinite;opacity:.9}
.fx.screen{width:3.2%;height:4%;border-radius:3px;background:radial-gradient(#7fd8ff40,transparent 70%);animation:flick 5s steps(1) infinite}
.motes{position:absolute;inset:0;pointer-events:none}
.motes i{position:absolute;bottom:-2%;width:3px;height:3px;border-radius:50%;background:#ffe2a8;box-shadow:0 0 6px #ffcf7a;opacity:0;animation:mote linear infinite}
@keyframes pulse{50%{opacity:.45}}
@keyframes holo{0%,100%{opacity:1;filter:hue-rotate(0)}30%{opacity:.7}33%{opacity:.95}60%{opacity:.75;filter:hue-rotate(-15deg)}}
@keyframes sweep{0%{top:56%;height:3%;opacity:0}15%{opacity:1}100%{top:100%;height:14%;opacity:0}}
@keyframes run{to{stroke-dashoffset:-100}}
@keyframes flick{0%,100%{opacity:.9}37%{opacity:.4}41%{opacity:1}73%{opacity:.6}}
@keyframes mote{0%{transform:translateY(0);opacity:0}15%{opacity:.7}85%{opacity:.5}100%{transform:translateY(-70vh) translateX(2vw);opacity:0}}
.paused .fx,.paused .fx *,.paused .motes i{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.fx,.fx *,.motes i{animation:none!important}}

/* ---------- agent rooms ---------- */
.room .shade{background:linear-gradient(90deg,#02050bcc 0%,#02050b55 22%,transparent 46%,transparent 62%,#02050bb0 100%),linear-gradient(0deg,#02050bd9,transparent 32%)}
.room .gen{position:absolute;inset:0;background:radial-gradient(circle at 50% 44%,color-mix(in srgb,var(--c) 30%,transparent),transparent 46%),#03060c}
.room .gen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(14px) brightness(.45) saturate(1.2);inset:-5%;width:110%;height:110%;transform:translateZ(0)}
.room .gen .big{position:absolute;left:42%;top:46%;transform:translate(-50%,-50%);width:min(30vw,280px);height:min(30vw,280px);font-size:clamp(40px,6vw,76px);animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translate(-50%,-54%)}}
.rail{position:absolute;left:max(16px,2.5vw);top:84px;display:flex;flex-direction:column;gap:4px;padding:8px;border:1px solid var(--line);border-radius:14px;background:var(--glass);backdrop-filter:blur(10px)}
.rail button{border:0;background:transparent;border-radius:9px;padding:9px 14px;text-align:left;font-size:12px;letter-spacing:.08em;color:#c9d4dc}
.rail button.on{background:#1d2a3a;color:var(--gold-hi);box-shadow:inset 2px 0 0 var(--c)}
.hud{position:absolute;right:max(16px,2.5vw);top:84px;bottom:84px;width:min(380px,36vw);display:flex;flex-direction:column;gap:12px;overflow:auto;padding:20px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:18px;background:#050a12d6;backdrop-filter:blur(14px);box-shadow:0 0 50px color-mix(in srgb,var(--c) 18%,transparent)}
.hud .eyebrow{font-size:10px;letter-spacing:.24em;color:var(--c)}
.hud h2{margin:0;font-size:clamp(26px,3vw,40px);letter-spacing:.2em;font-weight:500;color:#fff}
.hud .role{font-size:12px;letter-spacing:.14em;color:var(--gold-hi);text-transform:uppercase}
.hud blockquote{margin:4px 0 0;font-size:18px;font-style:italic;color:#e9dcc6}
.hud h3{margin:6px 0 0;font-size:10px;letter-spacing:.24em;color:var(--mute);font-weight:500}
.hud ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.hud li{display:flex;justify-content:space-between;gap:10px;padding:9px 11px;border-radius:9px;background:#0d1826;font-size:12px;color:#dbe6ee}
.hud li em{font-style:normal;font-size:10px;letter-spacing:.1em;color:var(--c)}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chain button{border:1px solid #ffffff22;background:#0d1826;border-radius:999px;padding:6px 10px;font-size:11px;color:#dbe6ee}
.chain button.me{border-color:var(--c);color:#fff;box-shadow:0 0 12px color-mix(in srgb,var(--c) 40%,transparent)}
.chain i{font-style:normal;color:var(--gold)}
.state{display:flex;gap:8px;flex-wrap:wrap}
.state button{border:1px solid color-mix(in srgb,var(--c) 50%,transparent);background:#0d1826;border-radius:8px;padding:8px 11px;font-size:11px}
.status-line{font-size:12px;color:#b9c7d3;padding:10px 12px;border-left:2px solid var(--c);background:#0a1420}
.room-name{position:absolute;left:max(16px,2.5vw);bottom:84px;pointer-events:none}
.room-name b{display:block;font-size:clamp(34px,5vw,64px);letter-spacing:.24em;font-weight:500;color:#fff;text-shadow:0 0 30px color-mix(in srgb,var(--c) 70%,transparent),0 4px 16px #000}
.room-name span{font-size:11px;letter-spacing:.3em;color:var(--c)}
.next-door{position:absolute;top:50%;transform:translateY(-50%);border:1px solid var(--line);background:var(--glass);border-radius:50%;width:44px;height:44px;font-size:18px;color:var(--gold-hi)}
.next-door.prev{left:calc(max(16px,2.5vw) + 170px)}.next-door.nxt{right:calc(max(16px,2.5vw) + min(380px,36vw) + 14px)}

/* ---------- office door: you're pulled up to the glass doors, they part, you're inside ---------- */
#doorfx{position:fixed;inset:0;z-index:19;display:flex;pointer-events:none;visibility:hidden}
#doorfx.on{visibility:visible;animation:doorStage 1.5s ease forwards}
#doorfx .leaf{flex:1;position:relative;background:linear-gradient(100deg,#060b14f2,#0d1726e8 45%,#060b14f2),repeating-linear-gradient(90deg,transparent 0 46px,#ffffff08 46px 47px);box-shadow:inset 0 0 120px #000}
#doorfx .leaf.l{border-right:2px solid var(--c);box-shadow:inset -30px 0 60px color-mix(in srgb,var(--c) 25%,transparent)}
#doorfx .leaf.r{border-left:2px solid var(--c);box-shadow:inset 30px 0 60px color-mix(in srgb,var(--c) 25%,transparent)}
#doorfx .leaf::after{content:'';position:absolute;top:44%;width:6px;height:120px;border-radius:3px;background:linear-gradient(var(--gold-hi),#8a6a3a)}
#doorfx .leaf.l::after{right:26px}#doorfx .leaf.r::after{left:26px}
#doorfx.on .leaf.l{animation:leafL 1.5s cubic-bezier(.75,0,.2,1) forwards}
#doorfx.on .leaf.r{animation:leafR 1.5s cubic-bezier(.75,0,.2,1) forwards}
#doorfx .plate{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
#doorfx.on .plate{animation:plate 1.5s ease forwards}
#doorfx .plate .orb{width:86px;height:86px;font-size:24px;box-shadow:0 0 60px var(--c)}
#doorfx .plate b{font-size:clamp(30px,5vw,58px);letter-spacing:.3em;font-weight:500;color:#fff;text-shadow:0 0 30px var(--c)}
#doorfx .plate>span:last-child{font-size:11px;letter-spacing:.32em;color:var(--c)}
@keyframes doorStage{0%{opacity:0;transform:scale(1.25)}14%{opacity:1;transform:scale(1)}100%{opacity:1}}
@keyframes leafL{0%,48%{transform:none}100%{transform:translateX(-102%)}}
@keyframes leafR{0%,48%{transform:none}100%{transform:translateX(102%)}}
@keyframes plate{0%{opacity:0;transform:translate(-50%,-40%)}16%,40%{opacity:1;transform:translate(-50%,-50%)}56%,100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
.scene.enter-door{animation:enterFwd 1.1s cubic-bezier(.2,.75,.2,1) .55s both}

/* ---------- office stage: still room, living robot ---------- */
.room .stage{position:absolute;left:var(--sx,0);top:var(--sy,0);width:var(--sw,100vw);height:var(--sh,100vh);overflow:hidden;transform:translateZ(0);backface-visibility:hidden;contain:strict}
.room .stage .still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.room .stage .clip{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s ease;-webkit-mask-image:radial-gradient(ellipse 25% 46% at var(--mx) var(--my),#000 52%,transparent 100%);mask-image:radial-gradient(ellipse 25% 46% at var(--mx) var(--my),#000 52%,transparent 100%)}
.room.listening .clip-listen,.room.speaking .clip-talk{opacity:1}
.room.listening .eye{opacity:.62;animation-duration:2.4s}
.room.listening .vorb{animation:listenPulse 1.3s ease-in-out infinite}
@keyframes listenPulse{50%{box-shadow:0 0 26px var(--c);transform:scale(1.12)}}
.room .stage .eye{position:absolute;left:var(--hx);top:var(--hy);width:12%;height:20%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 70%,#fff),color-mix(in srgb,var(--c) 35%,transparent) 45%,transparent);opacity:calc(.28 + var(--amp,0)*.7);animation:eye 4.2s ease-in-out infinite}
@keyframes eye{50%{filter:brightness(1.35)}}
.room.speaking .eye{animation-duration:1.1s}
.paused .room .eye{animation-play-state:paused}
.room .stage .shine{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:linear-gradient(105deg,transparent 40%,#ffffff14 47%,#ffffff22 50%,#ffffff14 53%,transparent 60%);background-size:300% 100%;animation:shine 9s ease-in-out infinite}
@keyframes shine{0%,20%{background-position:120% 0}70%,100%{background-position:-20% 0}}
.paused .room .shine{animation-play-state:paused}

/* ---------- talk-back: the agent has no mouth, so light, motion and captions carry the voice ---------- */

 s.querySelectorAll('[data-go]').forEach(b=>b.onclick=travel(b.dataset.go));

 const body=s.querySelector('[data-body]');

/* ===== Talk-back =====
   Preview replies come from each agent's own office data. The presentation layer is built so a live
   model (api/chat) can drop in later: swap reply() for a fetch and keep speak() as-is. */
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
function suggestions(a){return a.next?['What will this office do?']:['What are you working on?','Give me today’s numbers','What’s your role?','Hand this to the team']}
function reply(a,q){
 const t=q.toLowerCase(),today=a.today||[],missions=a.missions||[],duties=a.duties||[a.dept];
 const list=xs=>xs.length>1?xs.slice(0,-1).join(', ')+', and '+xs.at(-1):xs[0]||'';
 if(a.next)return `My office is still being built. Once it opens, I'll handle ${a.dept.toLowerCase()}.`;
 if(/^(hi|hey|hello|yo|good (morning|afternoon|evening))\b/.test(t))return pick([`Hey. ${a.name} here, ${a.role}. ${a.quote||''} What do you need?`,`Welcome in. I'm ${a.name}. Ask me anything about ${a.role.toLowerCase()}.`]);
 if(/number|today|stat|metric|how (are|is)|report|kpi/.test(t))return `Here's today: ${list(today.map(([n,l])=>`${n} ${l.toLowerCase()}`))}.`;
 if(/work|mission|project|progress|focus|doing/.test(t))return missions.length?`Right now I'm moving ${list(missions.map(([m,p])=>`${m} at ${p}`))}. ${missions[0][0]} is my top priority.`:`I'm focused on ${duties[0].toLowerCase()}.`;
 if(/role|who are you|what do you do|responsib|help/.test(t))return `I'm ${a.name}, ${a.role}. I own ${list(duties.slice(0,4).map(d=>d.toLowerCase()))}.`;
 if(/hand|send|approve|delegate|team|assign/.test(t))return a.id==='simon'?`Understood. I'll set the priority and pass it to Marie to dispatch. Gatekeeper reviews before anything goes out.`:a.id==='marie'?`On it. I'll split it across the floor and track every handoff. Gatekeeper gets the final review.`:a.id==='gatekeeper'?`Send it my way. Nothing goes out until it clears review, and anything sensitive comes back to you.`:`Got it. I'll draft my part, Marie routes it, and Gatekeeper signs off before it ships.`;
 return pick([`Noted: "${q}". In the live build I'll pull that straight from the CRM. For now I'm running on preview data.`,`Good question. Once I'm connected to the live CRM I'll answer that with real records. Right now this office is a preview.`]);
}
const synth=window.speechSynthesis;let voices=[];
if(synth){const load=()=>voices=synth.getVoices().filter(v=>/^en/i.test(v.lang));load();synth.addEventListener?.('voiceschanged',load)}
const VOICE_FEMALE=/female|zira|aria|jenny|samantha|victoria|karen|moira|tessa|susan|libby|sonia|natasha|google uk english female|google us english/i;
const FEMALE=new Set(['marie','iris','cammy','lucy','alice','sofia','claire','maven']);
function voiceFor(a){if(!voices.length)return null;const fem=voices.filter(v=>VOICE_FEMALE.test(v.name)),male=voices.filter(v=>!VOICE_FEMALE.test(v.name));const pool=(FEMALE.has(a.id)?fem:male).length?(FEMALE.has(a.id)?fem:male):voices;let h=0;for(const ch of a.id)h=(h*31+ch.charCodeAt(0))>>>0;return pool[h%pool.length]}
function wireConversation(s,a){
 const cap=s.querySelector('.caption'),form=s.querySelector('.composer'),input=form.querySelector('input'),voiceBtn=form.querySelector('.voice'),mic=form.querySelector('.mic'),clips={listening:s.querySelector('.clip-listen'),speaking:s.querySelector('.clip-talk')};
 let voiceOn=true,ampT,run=0,idleT,micOn=false;
 // idle → listening (you type or talk) → speaking (they answer) → idle. Each state crossfades its own clip over the still.
 function setState(st){
  s.dataset.state=st;s.classList.toggle('listening',st==='listening');s.classList.toggle('speaking',st==='speaking');
  for(const [k,v] of Object.entries(clips)){if(!v)continue;
   if(k===st&&!motionPaused){if(v.paused){v.currentTime=0;v.play().catch(()=>{})}}
   else setTimeout(()=>{if(s.dataset.state!==k){v.pause();v.currentTime=0}},500)}
 }
 function listen(){if(s.dataset.state==='speaking')return;setState('listening');clearTimeout(idleT);if(!micOn)idleT=setTimeout(()=>{if(s.dataset.state==='listening')setState('idle')},2600)}
 input.addEventListener('input',()=>input.value?listen():setState('idle'));
 voiceBtn.onclick=()=>{voiceOn=!voiceOn;voiceBtn.setAttribute('aria-pressed',String(voiceOn));voiceBtn.textContent=voiceOn?'🔊':'🔇';if(!voiceOn)synth?.cancel()};
 const setAmp=v=>s.style.setProperty('--amp',v.toFixed(2));
 function start(){clearTimeout(idleT);setState('speaking');clearInterval(ampT);ampT=setInterval(()=>setAmp(.35+Math.random()*.65),110)}
 function stop(){clearInterval(ampT);setAmp(0);if(s.dataset.state==='speaking')setState('idle')}
 function speak(text,asked){
  const id=++run;synth?.cancel();
  const words=text.split(/\s+/);
  cap.innerHTML=(asked?`<span class="you">You: ${asked.replace(/</g,'&lt;')}</span>`:'')+words.map(w=>`<span class="w">${w.replace(/</g,'&lt;')}</span> `).join('');
  const spans=[...cap.querySelectorAll('.w')];let lit=0;const light=n=>{for(;lit<Math.min(n,spans.length);lit++)spans[lit].classList.add('on')};
  start();
  // Captions always run on a timer; when the browser can speak, word boundaries keep them in sync with the voice.
  const voiced=voiceOn&&synth&&voices.length;let synced=false;const pace=voiced?330:240;let i=0;const tick=setInterval(()=>{if(id!==run)return clearInterval(tick);i++;if(!synced)light(i);if(i>=spans.length&&!(voiceOn&&synth&&synth.speaking)){clearInterval(tick);stop()}},pace);
  if(voiced){const u=new SpeechSynthesisUtterance(text);const v=voiceFor(a);if(v)u.voice=v;u.rate=1.02;u.pitch=FEMALE.has(a.id)?1.05:.92;
   let chars=0;const offsets=words.map(w=>{const o=chars;chars+=w.length+1;return o});
   u.onboundary=e=>{if(id!==run)return;synced=true;const n=offsets.findIndex(o=>o>e.charIndex);light(n<0?spans.length:n);setAmp(1)};
   u.onend=u.onerror=()=>{if(id!==run)return;clearInterval(tick);light(spans.length);stop()};
   synth.speak(u)}
 }
 form.onsubmit=e=>{e.preventDefault();const q=input.value.trim();if(!q)return;input.value='';speak(reply(a,q),q)};
 s.querySelectorAll('.suggest button').forEach(b=>b.onclick=()=>speak(reply(a,b.textContent),b.textContent));
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(SR){mic.hidden=false;mic.onclick=()=>{const r=new SR();r.lang='en-US';r.interimResults=true;mic.classList.add('live');synth?.cancel();run++;micOn=true;listen();
  r.onresult=e=>{input.value=[...e.results].map(x=>x[0].transcript).join('');if(e.results[e.results.length-1].isFinal){const q=input.value.trim();input.value='';if(q)speak(reply(a,q),q)}};
  r.onend=r.onerror=()=>{mic.classList.remove('live');micOn=false;if(s.dataset.state==='listening')setState('idle')};r.start()}}
 s.onArrive=()=>{cap.innerHTML='';setTimeout(()=>{if(current===s.dataset.key)speak(a.next?`${a.name}'s office is the next room in production.`:pick([`Hey. I'm ${a.name}. ${a.quote||''}`,`Welcome to my office. I'm ${a.name}, ${a.role}.`]))},1500)};
 s.onLeave=()=>{run++;synth?.cancel();clearTimeout(idleT);stop();setState('idle')};
 setState('idle');
}
